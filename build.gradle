plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

// Optional official Fabric mirror when the primary service is unreachable.
// Also redirects the Fabric repository installed by Loom itself.
repositories.withType(MavenArtifactRepository).configureEach { repository ->
    if (repository.url.host == 'maven.fabricmc.net' && project.hasProperty('fabric_maven_url')) {
        repository.url = project.property('fabric_maven_url')
    }
}

loom {
    if (project.hasProperty('fabric_maven_url')) {
        intermediaryUrl = project.property('fabric_maven_url').toString().replaceAll('/+$', '') +
                '/net/fabricmc/intermediary/%1$s/intermediary-%1$s-v2.jar'
    }
    splitEnvironmentSourceSets()
    mods {
        interstellar {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1' // Minecraft's JSON library, needed outside the game too.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

test { useJUnitPlatform() }

// Keep the development player's saved demo return record valid across launches.
tasks.named('runClient') {
    args '--username', 'InterstellarDev'
    if(project.hasProperty('interstellarProfile'))jvmArgs '-Dinterstellar.profile=true'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('packageDemo', Zip) {
    dependsOn 'remapJar'
    archiveBaseName = 'interstellar-demo'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('remapJar').flatMap { it.archiveFile }) { into 'mods' }
    from('docs/demo-quickstart.md') {
        rename { 'README.md' }
        filter { line -> line.replace('(minecraft-coverage.md)', '(docs/minecraft-coverage.md)').replace('(world-features.md)', '(docs/world-features.md)').replace('(horizon-body-study.md)', '(docs/horizon-body-study.md)') }
    }
    from(['docs/triangle-row.md', 'docs/science.md', 'docs/material-coverage.md', 'docs/minecraft-coverage.md', 'docs/world-features.md', 'docs/performance-review-2026-09-22.md', 'docs/quad-vertices.md', 'docs/gameplay-gravity.md']) { into 'docs' }
    from('docs/profiles/2026-09-23-gameplay-gravity.txt') { into 'docs/profiles' }
    from('docs/profiles/2026-09-24-arrow-course.txt') { into 'docs/profiles' }
    from('docs/profiles/2026-09-24-world-features.txt') { into 'docs/profiles' }
    from('docs/horizon-body-study.md') { into 'docs' }
    from('docs/profiles/2026-09-24-horizon-body.txt') { into 'docs/profiles' }
    from('THIRD-PARTY.md')
}
